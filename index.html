     <h1 class="animate__animated animate__bounce">NUEVAYOLLLL</h1>
   </div>
   <div class="musica-tema">
    <audio id="tema" loop>
      <source src="audio/tema.mp3" type="audio/mpeg">
        </audio>
        <button onclick="reproducirMusica()" id="botonMusica">
          ▶ REPRODUCIR TEMA
        </button>
</div>

<script>
function reproducirMusica() {
var audio = document.getElementById("tema");
var boton = document.getElementById("botonMusica");

if (audio.paused) {
  audio.play();
  boton.innerHTML = "Ⅱ PAUSAR TEMA";
} else {
  audio.pause();
  boton.innerHTML = "▶ REPRODUCIR TEMA";
}
}
</script>
